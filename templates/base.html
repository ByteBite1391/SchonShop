<!-- templates/base.html -->
<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}شون | قالب HTML5 فروشگاهی{% endblock %}</title>

    {% load static %}
    <!-- Vazirmatn Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- فایل‌های CSS قالب -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
    <link rel="stylesheet" href="{% static 'css/animate.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}" />

    <style>
      /* فونت وزیرمتن */
      body,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      a,
      span,
      div,
      button,
      input,
      select,
      textarea,
      label,
      li,
      strong,
      em,
      small,
      td,
      th,
      blockquote,
      address {
        font-family: "Vazirmatn", sans-serif !important;
      }

      /* آیکون‌های Font Awesome */
      .fa,
      .fas,
      .far,
      .fab,
      .fal,
      .fad,
      .fa-solid,
      .fa-regular,
      .fa-brands,
      .fa-light,
      .fa-thin,
      [class^="fa-"],
      [class*=" fa-"] {
        font-family: "Font Awesome 6 Free" !important;
        font-weight: 900;
      }

      .fab,
      .fa-brands,
      [class^="fa-brands"] {
        font-family: "Font Awesome 6 Brands" !important;
        font-weight: 400;
      }

      /* آیکون‌های Bootstrap */
      .bi,
      [class^="bi-"],
      [class*=" bi-"] {
        font-family: "bootstrap-icons" !important;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div id="wrapper">
      <div id="pre-loader" class="loader-container">
        <div class="loader">
          <img src="{% static 'images/svg/rings.svg' %}" alt="بارگذاری" />
        </div>
      </div>

      <div class="w1">
        {% include 'includes/header.html' %} {% if messages %}
        <div class="container" style="margin-top: 20px">
          {% for message in messages %}
          <div
            class="alert alert-{{ message.tags }}"
            style="padding: 15px; border-radius: 5px; margin-bottom: 15px"
          >
            {{ message }}
          </div>
          {% endfor %}
        </div>
        {% endif %}

        <main id="mt-main">{% block content %}{% endblock %}</main>

        {% include 'includes/footer.html' %}
      </div>

      <span id="back-top" class="fa fa-arrow-up"></span>
    </div>

    <script src="{% static 'js/jquery.js' %}"></script>
    <script src="{% static 'js/plugins.js' %}"></script>
    <script src="{% static 'js/jquery.main.js' %}"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
